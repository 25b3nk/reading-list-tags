<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="popup">
    <div>
      <div class="title" id="title">…</div>
      <div class="muted" id="status"></div>
    </div>
    <form class="row" id="form">
      <input type="text" id="tags" placeholder="tags, comma or space separated" autocomplete="off" autofocus>
      <button class="primary" type="submit" id="save">Save</button>
    </form>
    <div class="chips" id="suggest"></div>
    <div class="row">
      <button type="button" id="open-list">Open list</button>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
