<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="popup">
    <div class="pop-head">
      <div class="pop-page">
        <div class="title" id="title">…</div>
        <div class="status" id="status"></div>
      </div>
      <button type="button" class="ghost" id="open-list" title="Open the full reading list">Open list ↗</button>
    </div>
    <form id="form">
      <label class="label" for="tags">Tags</label>
      <div class="row">
        <input type="text" id="tags" placeholder="comma or space separated" autocomplete="off" autofocus>
        <button class="primary" type="submit" id="save">Save</button>
      </div>
    </form>
    <div class="read-row" id="read-row" hidden>
      <span class="muted" id="read-hint">Finished reading?</span>
      <button type="button" id="toggle-read">Mark read</button>
    </div>
    <div class="suggest">
      <div class="label">Your tags</div>
      <div class="chips" id="suggest"></div>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
